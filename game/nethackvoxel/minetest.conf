# Game defaults (players can override in their own config)
mg_name = singlenode
dedicated_server_step = 0.03
enable_damage = false
creative_mode = false
hud_hotbar_max_width = 1.0

# Map loading: levels are small (a whole level is about 160 map blocks), so
# the server sends everything near you at once instead of trickling it out:
# more blocks in flight, no holding back blocks it guesses are hidden behind
# walls (they popped in late round corners), and the client keeps a whole
# level atlas loaded (about 300 MB at most) instead of dropping and
# fetching blocks again.
max_simultaneous_block_sends_per_client = 200
server_side_occlusion_culling = false
block_send_optimize_distance = 13
client_mapblock_limit = 20000
