# Game defaults (players can override in their own config)
mg_name = singlenode
dedicated_server_step = 0.03
enable_damage = false
creative_mode = false
hud_hotbar_max_width = 1.0

# Each map block meshed on its own: grouping them 2x2x2 (the engine's
# default) left whole groups undrawn in the prefab editor and atlas
client_mesh_chunk = 1

# A new level reaches the screen all at once, and fast: every one of its
# map blocks is sent (none held back as out of sight, behind you or too
# far: a level is only about 250 blocks), many at a time
nhv_send_all_directions = true
server_side_occlusion_culling = false
max_block_send_distance = 24
block_send_optimize_distance = 24
max_simultaneous_block_sends_per_client = 300
